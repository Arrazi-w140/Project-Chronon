[package]
name = "widget-time"
version = "0.1.0"
description = "Chronon — a lightweight, customizable desktop time & date widget."
authors = ["Arrazi"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "widget_time_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Only pulled in on Windows: used by desktop_layer.rs to reparent the
# widget into the WorkerW layer behind the desktop icons. The same
# `windows` crate version tauri/wry already depend on internally, so this
# doesn't add a second copy to the dependency graph.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

