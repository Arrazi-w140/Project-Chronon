<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Chronon Widget</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* This page renders inside a borderless, transparent Tauri window (see
       src-tauri/src/widget_window.rs), so it overrides the editor's opaque
       html/body background from styles.css instead of touching that shared
       file. .widget-mock itself (background/padding/radius) is still driven
       live by renderWidgetChrome() in widget-renderer.js. */
    html, body {
      background: transparent;
      overflow: hidden;
    }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-user-select: none;
      user-select: none;
      /* Not draggable, not clickable-into-anything: this is a display-only
         desktop widget. Position is controlled from the editor's Settings
         page (see src-tauri/src/widget_window.rs's set_widget_position),
         not by dragging the widget itself. */
      cursor: default;
    }
    #widgetRoot {
      width: 100%;
    }
  </style>
</head>
<!-- No data-tauri-drag-region here on purpose: this widget is positioned
     from Settings, not by dragging, and a click on it should do nothing
     but display the clock. -->
<body>
  <div class="widget-mock" id="widgetRoot"></div>

  <script src="time-formats.js"></script>
  <script src="widget-renderer.js"></script>
  <script src="widget.js"></script>
</body>
</html>
